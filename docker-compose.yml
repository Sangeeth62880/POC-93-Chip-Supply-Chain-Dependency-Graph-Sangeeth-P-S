version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: chip-dependency-graph-backend
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGINS=http://localhost:3000
      - SAM_API_KEY=${SAM_API_KEY:-}
      - USASPENDING_API_KEY=${USASPENDING_API_KEY:-}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    container_name: chip-dependency-graph-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
